name: Tarif listesini güncelle
on:
  push:
    branches: [main]
    paths: ['t/**', 'scripts/**', 'index.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: derle
  cancel-in-progress: false
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Liste ve sitemap üret
        run: node scripts/derle.js
      - name: Üretilenleri depoya yaz
        run: |
          git config user.name "lezzet-bot"
          git config user.email "lezzet-bot@users.noreply.github.com"
          git add tarifler.json sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Tarif listesi güncellendi"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main || { git checkout --theirs tarifler.json sitemap.xml 2>/dev/null; node scripts/derle.js; git add tarifler.json sitemap.xml; GIT_EDITOR=true git rebase --continue; }
            node scripts/derle.js
            git add tarifler.json sitemap.xml
            git diff --cached --quiet || git commit -m "Tarif listesi güncellendi"
            git push && exit 0
            sleep 5
          done
          exit 1
